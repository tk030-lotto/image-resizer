o{color:#3b82f6}.result-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.result-title{font-size:1.1rem;font-weight:700;color:#fff}.status-pill{font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:9999px}.pill-success{background:#10b98126;color:var(--success);border:1px solid rgba(16,185,129,.3)}.pill-warning{background:#eab30826;color:var(--warning);border:1px solid rgba(234,179,8,.3)}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}.stat-card{padding:12px 14px;border-radius:var(--radius-md);background:var(--card-bg-elevated);border:1px solid var(--card-border);display:flex;flex-direction:column;gap:4px}.stat-label{font-size:.72rem;color:var(--text-dim)}.stat-value{font-family:var(--font-mono);font-size:1.3rem;font-weight:700;color:#fff}.stat-primary .stat-value{color:#3b82f6}.stat-success .stat-value{color:var(--success)}.stat-danger .stat-value{color:var(--danger)}.destination-box{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius-md);background:var(--card-bg-elevated);border:1px solid var(--card-border);margin-bottom:16px}.dest-icon{font-size:1.2rem}.dest-text{font-size:.82rem;word-break:break-all}.dest-title{color:var(--text-muted)}.dest-path{font-family:var(--font-mono);font-weight:600;color:#fff}.result-alert{padding:10px 14px;border-radius:var(--radius-md);font-size:.8rem;margin-bottom:14px}.alert-warning{background:#eab3081f;border:1px solid rgba(234,179,8,.25);color:var(--warning)}.result-section{margin-top:14px}.section-subtitle{font-size:.85rem;font-weight:600;margin-bottom:8px}.failure-title{color:var(--danger)}.success-title{color:var(--success)}.result-list{list-style:none;display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;padding-right:4px}.result-item{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border-radius:var(--radius-md);background:var(--card-bg-elevated);border:1px solid var(--card-border);font-size:.82rem}.li-success{border-color:#10b98133}.li-danger{border-color:#ef444433}.status-icon{font-weight:700}.icon-ok{color:var(--success)}.icon-ng{color:var(--danger)}.item-info{flex:1;min-width:0;word-break:break-all}.item-name{font-weight:500;color:#fff}.item-detail{font-size:.75rem;margin-top:2px}.text-danger{color:var(--danger)}.text-warn{color:var(--warning)}</style>
  </head>
  <body>
    <!-- グローバルドラッグオーバーレイ -->
    <div id="drag-overlay" class="drag-overlay" aria-hidden="true">
      <div class="drag-overlay-content">
        <span class="drag-overlay-icon">📥</span>
        <p class="drag-overlay-text">ここに画像をドロップして追加</p>
      </div>
    </div>

    <main class="app-container">
      <!-- ヘッダーバー (Project Stats Tool スタイル) -->
      <header class="app-header">
        <div class="header-brand">
          <div class="app-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
              <circle cx="9" cy="9" r="2"/>
              <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
            </svg>
          </div>
          <div>
            <h1 class="app-title">Image Resizer</h1>
            <p class="app-subtitle">長辺指定で複数画像をまとめてリサイズするWebツール</p>
          </div>
        </div>
        <button id="header-select-btn" type="button" class="header-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" x2="12" y1="3" y2="15"/>
          </svg>
          <span>画像を選択</span>
        </button>
      </header>

      <!-- メインドロップゾーンカード (Project Stats Tool スタイル) -->
      <section class="upload-card">
        <label for="file-input" id="drop-zone" class="drop-zone">
          <div class="drop-icon-box">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
              <line x1="12" y1="8" x2="12" y2="16"/>
              <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
          </div>
          <h2 class="drop-primary-heading">リサイズする画像を選択</h2>
          <p class="drop-secondary-desc">
            ボタンをクリックまたは画像を直接ドラッグ＆ドロップしてください。<br />
            JPG / JPEG / PNG / WebP（複数可）に対応しています。
          </p>
          <div class="btn-main-action">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
              <circle cx="9" cy="9" r="2"/>
              <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
            </svg>
            <span>画像を選択する</span>
          </div>
        </label>
        <input
          id="file-input"
          type="file"
          multiple
          accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
          style="position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none;"
        />
      </section>

      <!-- ファイルキュー一覧カード -->
      <section id="file-list-card" class="card" hidden>
        <div class="card-header">
          <div class="queue-meta">
            <span class="card-title">選択中のファイル</span>
            <span id="queue-count-badge" class="count-badge">0 件</span>
          </div>
          <button id="clear-all-btn" type="button" class="btn-text text-danger">すべてクリア</button>
        </div>
        <div id="file-list" class="file-grid"></div>
      </section>

      <!-- 設定＆実行フォームカード -->
      <form id="convert-form" class="card">
        <div class="card-header">
          <span class="card-title">変換設定</span>
        </div>

        <div class="config-grid">
          <!-- 長辺指定 -->
          <div class="form-group">
            <label for="long-edge" class="form-label">
              <span>長辺サイズ</span>
              <span class="label-hint">※元画像より小さい場合は拡大しません</span>
            </label>
            <div class="input-with-unit">
              <input
                id="long-edge"
                type="number"
                min="1"
                max="20000"
                step="1"
                value="1280"
                required
                class="form-input text-mono"
              />
              <span class="unit-badge">px</span>
            </div>
            <!-- プリセットボタン -->
            <div class="preset-buttons">
              <button type="button" class="preset-btn" data-size="1920">1920 (FHD)</button>
              <button type="button" class="preset-btn active" data-size="1280">1280 (HD)</button>
              <button type="button" class="preset-btn" data-size="1080">1080 (SNS)</button>
              <button type="button" class="preset-btn" data-size="800">800 (Web)</button>
            </div>
          </div>

          <!-- 出力フォルダ名 -->
          <div class="form-group">
            <label for="output-name" class="form-label">
              <span>保存フォルダ名</span>
            </label>
            <input
              id="output-name"
              type="text"
              value="resized"
              maxlength="100"
              required
              class="form-input text-mono"
            />
          </div>
        </div>

        <!-- 案内メッセージ -->
        <div id="mode-note" class="info-banner"></div>

        <!-- プログレスバー -->
        <div id="progress-wrapper" class="progress-wrapper" hidden>
          <div class="progress-header">
            <span id="progress-status-text" class="progress-status-text">変換処理中...</span>
            <span id="progress-percent-text" class="progress-percent-text">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
          </div>
        </div>

        <!-- 変換開始ボタン -->
        <button id="start-button" type="submit" class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <span>変換開始</span>
        </button>
      </form>

      <!-- 処理結果セクション -->
      <section id="result" class="card" hidden aria-live="polite"></section>

      <!-- フッターステータスバー -->
      <div class="app-footer-stats">
        <div class="footer-stat-item">
          <svg class="footer-icon-success" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span>ブラウザ内処理（外部送信なし）</span>
        </div>
        <div class="footer-stat-item">
          <svg class="footer-icon-warning" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
          <span>複数画像の一括変換</span>
        </div>
        <div class="footer-stat-item">
          <svg class="footer-icon-info" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" x2="12" y1="3" y2="15"/>
          </svg>
          <span>ドラッグ＆ドロップ対応</span>
        </div>
      </div>

      <!-- フッター（UI-STANDARD.md 準拠） -->
      <footer class="app-footer">
        <p class="footer-copyright">
          © 2026 Zero Dev (tk030) · MIT License ·
          <a href="https://zero-dev.jp/" target="_blank" rel="noopener noreferrer">zero-dev.jp</a> ·
          免責：本ツールは無保証で提供され、利用により生じた損害について制作者は責任を負いません。
        </p>
      </footer>
    </main>

  </body>
</html>
