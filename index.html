er)}.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:.8rem}.progress-status-text{font-weight:600;color:var(--text-main)}.progress-percent-text{font-family:var(--font-mono);font-weight:700;color:var(--accent)}.progress-bar-bg{width:100%;height:8px;background:var(--card-border);border-radius:9999px;overflow:hidden}.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent) 0%,#6366f1 100%);border-radius:9999px;transition:width .2s ease}.btn-primary{width:100%;padding:13px;display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--radius-md);background:linear-gradient(135deg,var(--accent) 0%,#2563eb 100%);color:#fff;font-size:.95rem;font-weight:600;cursor:pointer;box-shadow:0 4px 14px var(--accent-glow);transition:all .15s ease}.btn-primary:hover:not(:disabled){background:linear-gradient(135deg,#2563eb,#1d4ed8);transform:translateY(-1px);box-shadow:0 6px 20px var(--accent-glow)}.btn-primary:active:not(:disabled){transform:translateY(0)}.btn-primary:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}.result-card{border-color:var(--card-border)}.result-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.result-title{font-size:1.05rem;font-weight:700;letter-spacing:-.01em}.status-pill{font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:9999px}.pill-success{background:var(--success-bg);color:var(--success);border:1px solid var(--success-border)}.pill-warning{background:var(--warning-bg);color:var(--warning);border:1px solid var(--warning-border)}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}.stat-card{padding:12px;border-radius:var(--radius-md);background:var(--card-bg-elevated);border:1px solid var(--card-border);display:flex;flex-direction:column;gap:4px}.stat-label{font-size:.72rem;font-weight:500;color:var(--text-dim)}.stat-value{font-family:var(--font-mono);font-size:1.3rem;font-weight:700;color:var(--text-main)}.stat-primary .stat-value{color:var(--accent)}.stat-success .stat-value{color:var(--success)}.stat-danger .stat-value{color:var(--danger)}.stat-info .stat-value{color:var(--info)}.destination-box{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-md);background:var(--card-bg-elevated);border:1px solid var(--card-border);margin-bottom:16px}.dest-icon{font-size:1.25rem}.dest-text{font-size:.8rem;word-break:break-all}.dest-title{color:var(--text-dim)}.dest-path{font-family:var(--font-mono);font-weight:600;color:var(--text-main)}.result-alert{padding:10px 14px;border-radius:var(--radius-md);font-size:.78rem;margin-bottom:14px}.alert-warning{background:var(--warning-bg);border:1px solid var(--warning-border);color:var(--warning)}.result-section{margin-top:14px}.section-subtitle{font-size:.82rem;font-weight:600;margin-bottom:8px}.failure-title{color:var(--danger)}.success-title{color:var(--success)}.result-list{list-style:none;display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto;padding-right:4px}.result-item{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border-radius:var(--radius-md);background:var(--card-bg-elevated);border:1px solid var(--card-border);font-size:.8rem}.li-success{border-color:#10b98133}.li-danger{border-color:#ef444433}.status-icon{font-weight:700;font-size:.9rem;line-height:1.2}.icon-ok{color:var(--success)}.icon-ng{color:var(--danger)}.item-info{flex:1;min-width:0;word-break:break-all}.item-name{font-weight:500;color:var(--text-main)}.item-detail{font-size:.72rem;margin-top:2px}.text-danger{color:var(--danger)}.text-warn{color:var(--warning)}</style>
  </head>
  <body>
    <!-- グローバルドラッグオーバーレイ -->
    <div id="drag-overlay" class="drag-overlay" aria-hidden="true">
      <div class="drag-overlay-content">
        <span class="drag-overlay-icon">📥</span>
        <p class="drag-overlay-text">ここに画像をドロップして追加</p>
      </div>
    </div>

    <main class="app-container">
      <!-- ヘッダー -->
      <header class="app-header">
        <div class="header-brand">
          <div class="app-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
              <circle cx="9" cy="9" r="2"/>
              <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
            </svg>
          </div>
          <div class="brand-text">
            <h1 class="app-title">Image Resizer</h1>
            <p class="app-subtitle">長辺指定一括リサイズ・完全オフライン処理</p>
          </div>
        </div>
        <div class="header-badges">
          <span class="badge badge-success">
            <span class="badge-dot"></span>Client-Side
          </span>
          <span class="badge badge-info">Zero Upload</span>
        </div>
      </header>

      <!-- ドロップゾーンカード (ネイティブ label 連携で確実なファイル選択) -->
      <section class="card upload-card">
        <label for="file-input" id="drop-zone" class="drop-zone">
          <div class="drop-icon-wrapper">
            <svg class="drop-icon" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" x2="12" y1="3" y2="15"/>
            </svg>
          </div>
          <p class="drop-primary-text">ここに画像をドラッグ＆ドロップ</p>
          <div class="browse-action-wrapper">
            <span class="btn-browse">ファイルを選択</span>
            <span class="drop-sub-text">（複数選択対応）</span>
          </div>
          <div class="supported-formats">
            <span class="format-tag">JPG</span>
            <span class="format-tag">JPEG</span>
            <span class="format-tag">PNG</span>
            <span class="format-tag">WebP</span>
          </div>
        </label>
        <input
          id="file-input"
          type="file"
          multiple
          accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
          style="position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none;"
        />
      </section>

      <!-- ファイルキュー一覧カード -->
      <section id="file-list-card" class="card queue-card" hidden>
        <div class="card-header">
          <div class="queue-meta">
            <span class="card-title">選択中のファイル</span>
            <span id="queue-count-badge" class="count-badge">0 件</span>
          </div>
          <button id="clear-all-btn" type="button" class="btn-text text-danger">すべてクリア</button>
        </div>
        <div id="file-list" class="file-grid"></div>
      </section>

      <!-- 設定＆実行フォームカード -->
      <form id="convert-form" class="card config-card">
        <div class="card-header">
          <span class="card-title">変換設定</span>
        </div>

        <div class="config-grid">
          <!-- 長辺指定 -->
          <div class="form-group">
            <label for="long-edge" class="form-label">
              <span>長辺サイズ</span>
              <span class="label-hint">※元画像より小さい場合は拡大しません</span>
            </label>
            <div class="input-with-unit">
              <input
                id="long-edge"
                type="number"
                min="1"
                max="20000"
                step="1"
                value="1280"
                required
                class="form-input text-mono"
              />
              <span class="unit-badge">px</span>
            </div>
            <!-- プリセットボタン -->
            <div class="preset-buttons">
              <button type="button" class="preset-btn" data-size="1920">1920 (FHD)</button>
              <button type="button" class="preset-btn active" data-size="1280">1280 (HD)</button>
              <button type="button" class="preset-btn" data-size="1080">1080 (SNS)</button>
              <button type="button" class="preset-btn" data-size="800">800 (Web)</button>
            </div>
          </div>

          <!-- 出力フォルダ名 -->
          <div class="form-group">
            <label for="output-name" class="form-label">
              <span>保存フォルダ名</span>
            </label>
            <input
              id="output-name"
              type="text"
              value="resized"
              maxlength="100"
              required
              class="form-input text-mono"
            />
          </div>
        </div>

        <!-- 案内メッセージ -->
        <div id="mode-note" class="info-banner"></div>

        <!-- プログレスバー -->
        <div id="progress-wrapper" class="progress-wrapper" hidden>
          <div class="progress-header">
            <span id="progress-status-text" class="progress-status-text">変換処理中...</span>
            <span id="progress-percent-text" class="progress-percent-text">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
          </div>
        </div>

        <!-- 変換開始ボタン -->
        <button id="start-button" type="submit" class="btn-primary">
          <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <span>変換開始</span>
        </button>
      </form>

      <!-- 処理結果セクション -->
      <section id="result" class="card result-card" hidden aria-live="polite"></section>
    </main>

  </body>
</html>
